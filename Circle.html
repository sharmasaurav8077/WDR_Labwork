<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="radius, initial-scale=1">
	<title>circle</title>
	<script>
		/*---- function for calculating area of circle ----*/
		function calculateArea()
		{
			/*----setting result div as blank -----*/
			document.getElementById('result').innerText = "";
			/*---- fetching data from textfield ------*/
			const radius  = parseFloat(document.getElementById('first_number').value);
			
			const area = 3.14* radius* radius;
			/*---- displaying data in div ----*/
			document.getElementById('result').innerText = "Area of circle : "+area;
		}
		/*---- function for calculating perimeter of circle ----*/
		function calculatePerimeter()
		{
			/*----setting result div as blank -----*/
			document.getElementById('result').innerText = "";
			/*---- fetching data from textfield ------*/
			const radius= parseFloat(document.getElementById('first_number').value);
			
			/*--- calculating perimeter ----*/
			const perimeter = 2* 3.14* radius;
			/*---- displaying data in div ----*/
			document.getElementById('result').innerText = "Perimeter of circle : "+perimeter;
		}
	</script>
</head>
<body>
	<h2>-----Circle -----</h2>
	Radius : <input type="number" id ="first_number" min=0 step=0.01 required>
	<br><br>
	
	
	<input type="button" value="Area" onclick="calculateArea()">

	<input type="button" value="Perimeter" onclick="calculatePerimeter()">
	<br><br>
	<div id ="result">

	</div>
</body>
</html>
